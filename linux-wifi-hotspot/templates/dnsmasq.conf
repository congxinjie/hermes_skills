# dnsmasq config for the AP subnet (run directly: sudo dnsmasq -C <conf>)
# dnsmasq-base on Ubuntu provides /usr/sbin/dnsmasq without an init script.
# bind-interfaces + interface= avoids clashing with systemd-resolved (127.0.0.53).
interface=ap0
bind-interfaces
dhcp-range=10.42.0.100,10.42.0.200,255.255.255.0,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
no-resolv
server=223.5.5.5
server=119.29.29.29
