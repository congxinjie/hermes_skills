# hostapd config for a virtual AP interface (Intel iwlwifi softAP)
# NOTE: channel + hw_mode MUST match the STA uplink's channel (same radio).
# Read it with: iw dev wlo1 info   (e.g. "channel 56 (5280 MHz)" => hw_mode=a channel=56)
# 2.4 GHz uplink => hw_mode=g + a 2.4 GHz channel (1/6/11 preferred).
interface=ap0
driver=nl80211
ssid=CHANGE_ME
hw_mode=a
channel=56
wmm_enabled=1
country_code=CN
wpa=2
wpa_passphrase=CHANGE_ME_8PLUS
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ignore_broadcast_ssid=0
